name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 执行打包命令
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: NoticeFix-debug-apk
          path: app/build/outputs/apk/debug/*.apk

